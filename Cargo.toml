[package]
name = "ggwave"
version = "0.1.0"
edition = "2021"
rust-version = "1.73"
description = "Pure safe Rust port of ggwave, the data-over-sound modem, wire-compatible with C ggwave"
license = "MIT"
repository = "https://github.com/katzenpost/ggwave-rs"
homepage = "https://github.com/katzenpost/ggwave-rs"
documentation = "https://docs.rs/ggwave"
readme = "README.md"
keywords = ["ggwave", "audio", "data-over-sound", "fsk", "modem"]
categories = ["multimedia::audio", "encoding"]
# users get the library; the C vectors, tests and tooling stay in the repo
include = ["src/", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]

# the decoder runs thousands of FFTs per message; keep `cargo test` quick
[profile.test]
opt-level = 2
